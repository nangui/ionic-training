<div class="filtres">
  <div class="filtres__rangee" role="group" aria-label="Filtrer par statut">
    @for (statut of tousStatuts; track statut) {
      <button
        class="etiquette"
        type="button"
        [class.etiquette--active]="statutActif(statut)"
        [attr.aria-pressed]="statutActif(statut)"
        (click)="statutBascule.emit(statut)"
      >
        {{ libellesStatut[statut] }}
      </button>
    }
  </div>

  <div class="filtres__rangee" role="group" aria-label="Filtrer par catégorie">
    @for (categorie of toutesCategories; track categorie) {
      <button
        class="etiquette"
        type="button"
        [class.etiquette--active]="categorieActive(categorie)"
        [attr.aria-pressed]="categorieActive(categorie)"
        (click)="categorieBasculee.emit(categorie)"
      >
        {{ libellesCategorie[categorie] }}
      </button>
    }
  </div>
</div>
