<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="utf-8" />
  <title>Signalements</title>

  <base href="/" />

  <meta name="color-scheme" content="light dark" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <link rel="icon" type="image/png" href="assets/icon/favicon.png" />

  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <script>
    // Applique le theme avant le premier rendu : sans ca, un utilisateur en
    // mode sombre voit un flash blanc entre le splash et l'application, le
    // temps qu'Angular demarre et que ThemeService pose la classe.
    (function () {
      try {
        var choix = localStorage.getItem('app.theme') || 'systeme';
        var sombre =
          choix === 'sombre' ||
          (choix === 'systeme' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('ion-palette-dark', sombre);
        document.documentElement.style.colorScheme = sombre ? 'dark' : 'light';
      } catch (e) {
        // Stockage indisponible : ThemeService prendra le relais au demarrage.
      }
    })();
  </script>
</head>

<body>
  <app-root></app-root>
</body>

</html>
